name: CI

on:
  push:
    branches: [main, "m*-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup (Linux)
        if: runner.os == 'Linux'
        run: tools/setup.sh
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: clippy (SDL3 wheel feature)
        if: runner.os == 'Linux'
        run: cargo clippy -p racer-game --features wheel --all-targets --locked -- -D warnings

  capture:
    name: capture (Linux, lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup
        run: tools/setup.sh
      - uses: Swatinem/rust-cache@v2
      - name: Validate tracks
        run: cargo run -p racer-trackc -- validate data/tracks/*/
      - name: Capture greybox scene
        run: tools/capture.sh greybox captures/greybox
      - name: Capture driving scene
        run: tools/capture.sh driving captures/driving
      - name: Capture menu and race scenes
        run: |
          tools/capture.sh menu captures/menu
          CAPTURE_PROFILE=release tools/capture.sh race captures/race --timeout 2400
      - name: Compare with goldens
        run: |
          target/debug/racer-capture diff captures/greybox crates/racer-capture/goldens/greybox
          target/debug/racer-capture diff captures/driving crates/racer-capture/goldens/driving
          target/debug/racer-capture diff captures/menu crates/racer-capture/goldens/menu
          target/release/racer-capture diff captures/race crates/racer-capture/goldens/race
      - name: AI laps and races (short; tools/ai-check.sh runs the full 100-lap check)
        run: tools/ai-check.sh captures/ai 5 4 5
      - name: Telemetry runs and plots
        run: tools/telemetry.sh captures/telemetry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: captures/
          if-no-files-found: warn
