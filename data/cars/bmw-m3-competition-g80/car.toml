# BMW M3 Competition Sedan (G80), rear-wheel drive. Published values carry
# their sources per table; everything under [estimated] is not published and
# was estimated from class norms, then fitted to the [reference] figures.
id = "bmw-m3-competition-g80"
name = "BMW M3 Competition (G80)"
variant = "Sedan, 375 kW (510 PS), 8-speed M Steptronic, RWD (not xDrive), 19/20-inch wheels"

[chassis]
sources = [
    "mass (DIN, no driver), dimensions, wheelbase, track: BMW Media Information 03/2021 https://www.press.bmwgroup.com/global/article/attachment/T0316649EN/476823",
    "weight distribution: not published; estimated 0.53 front (front-engine sedan, battery in the boot)",
]
curb_mass_kg = 1730.0
mass_basis = "DIN, no driver"
front_weight_fraction = 0.53
length_m = 4.794
width_m = 1.903
height_m = 1.433
wheelbase_m = 2.857
track_front_m = 1.617
track_rear_m = 1.605

[engine]
sources = [
    "power, torque, top speed: BMW Media Information 03/2021 https://www.press.bmwgroup.com/global/article/attachment/T0316649EN/476823",
    "redline: BMW USA press release https://www.press.bmwgroup.com/usa/article/detail/T0317577EN_US/the-new-2021-bmw-m3-sedan-and-m4-coupe",
]
description = "S58 3.0 twin-turbo inline-6, 2993 cc"
peak_power_kw = 375.0
peak_power_rpm = [6250.0, 6250.0]
peak_torque_nm = 650.0
peak_torque_rpm = [2750.0, 5500.0]
limiter_rpm = 7200.0
top_speed_kmh = 250.0
top_speed_governed = true

[gearbox]
sources = ["BMW Media Information 03/2021 https://www.press.bmwgroup.com/global/article/attachment/T0316649EN/476823"]
description = "ZF-based 8-speed M Steptronic torque-converter automatic with Drivelogic"
ratios = [5.000, 3.200, 2.143, 1.720, 1.313, 1.000, 0.823, 0.640]
reverse = 3.478
final_drive = [3.154]

[driveline]
sources = ["BMW Media Information 03/2021 https://www.press.bmwgroup.com/global/article/attachment/T0316649EN/476823"]
layout = "rwd"
description = "Active M Differential (electronically controlled rear locking differential)"

[brakes]
sources = ["BMW USA press release https://www.press.bmwgroup.com/usa/article/detail/T0317577EN_US/the-new-2021-bmw-m3-sedan-and-m4-coupe"]
front_disc_mm = 380.0
rear_disc_mm = 370.0

[steering]
sources = [
    "ratio: BMW Media Information 03/2021 https://www.press.bmwgroup.com/global/article/attachment/T0316649EN/476823",
    "turns lock to lock: not published; estimated 2.4",
]
lock_to_lock_turns = 2.4
ratio = 15.0

[tires]
sources = [
    "Competition sizes: BMW USA press release https://www.press.bmwgroup.com/usa/article/detail/T0317577EN_US/the-new-2021-bmw-m3-sedan-and-m4-coupe",
    "the EU sheet lists 275/40 ZR18 / 285/35 ZR19; the test cars ran 19/20 inch Michelin Pilot Sport 4S https://www.caranddriver.com/reviews/a37286079/2021-bmw-m3-competition-by-the-numbers/",
]
front = "275/35 ZR19"
rear = "285/30 ZR20"
model = "Michelin Pilot Sport 4S"

[aero]
sources = ["BMW Media Information 03/2021 https://www.press.bmwgroup.com/global/article/attachment/T0316649EN/476823"]
