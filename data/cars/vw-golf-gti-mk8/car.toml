# Volkswagen Golf GTI (Mk8). Published values carry their sources per table;
# everything under [estimated] is not published and was estimated from class
# norms, then fitted to the [reference] figures by the maneuver tests.
id = "vw-golf-gti-mk8"
name = "Volkswagen Golf GTI (Mk8)"
variant = "EU 2.0 TSI 180 kW (245 PS), 7-speed DSG, FWD, optional 19-inch wheels (as tested by Car and Driver)"

[chassis]
sources = [
    "mass: Car and Driver measured curb (Euro-spec DSG, no driver) https://www.caranddriver.com/reviews/a36406955/2022-volkswagen-golf-gti-by-the-numbers/",
    "weight distribution: MotorTrend measured (DSG) https://www.motortrend.com/reviews/2023-volkswagen-golf-gti-yearlong-review-verdict/",
    "dimensions, wheelbase: ADAC Autokatalog https://www.adac.de/rund-ums-fahrzeug/autokatalog/marken-modelle/vw/golf/viii/318761",
    "track: CarExpert https://www.carexpert.com.au/volkswagen/golf/2021-gti-2l-hatchback-fwd-petrol-automatic-jo8gwkaa20210222",
]
curb_mass_kg = 1431.0
mass_basis = "measured curb, no driver"
front_weight_fraction = 0.62
length_m = 4.287
width_m = 1.789
height_m = 1.478
wheelbase_m = 2.627
track_front_m = 1.535
track_rear_m = 1.513

[engine]
sources = [
    "power, torque, top speed: VW press kit https://www.volkswagen-newsroom.com/en/the-new-golf-gti-international-media-drive-6282/engine-of-the-new-golf-gti-6285",
    "limiter: not published; C&D quotes peak power at 6500 rpm, limiter estimated at 6700",
]
description = "EA888 evo4 2.0 TSI inline-4 turbo, 1984 cc"
peak_power_kw = 180.0
peak_power_rpm = [5000.0, 6500.0]
peak_torque_nm = 370.0
peak_torque_rpm = [1600.0, 4300.0]
limiter_rpm = 6700.0
top_speed_kmh = 250.0
top_speed_governed = true

[gearbox]
sources = [
    "ratios and the two final drives: VW of America 2024 GTI technical specifications https://media.vw.com/assets/documents/original/17302-2024GolfGTITechnicalSpecsFINAL.pdf",
    "gear-to-final-drive mapping is inferred (not published): the only split that gives a monotonic progression",
]
description = "DQ381 7-speed wet dual-clutch (DSG)"
ratios = [3.40, 2.75, 1.76, 0.92, 0.70, 0.75, 0.63]
reverse = 2.90
final_drive = [4.17, 3.13, 3.13, 4.17, 4.17, 3.13, 3.13]

[driveline]
sources = ["VW press kit, running gear https://www.volkswagen-newsroom.com/en/the-new-golf-gti-international-media-drive-6282/running-gear-for-the-new-golf-gti-6286"]
layout = "fwd"
description = "Electronically controlled multi-plate front differential lock (VAQ)"

[brakes]
sources = ["Car and Driver test https://www.caranddriver.com/reviews/a36406955/2022-volkswagen-golf-gti-by-the-numbers/"]
front_disc_mm = 340.0
rear_disc_mm = 310.0

[steering]
sources = [
    "ratio: km77 https://km77.com/coches/volkswagen/golf/2020/5-puertas/gti/informacion/volkswagen-golf-gti-2020-informacion-tecnica",
    "turns: VW press kit https://www.volkswagen-newsroom.com/en/the-new-golf-gti-international-media-drive-6282/running-gear-for-the-new-golf-gti-6286",
]
lock_to_lock_turns = 2.1
ratio = 14.1

[tires]
sources = ["Car and Driver test car tires https://www.caranddriver.com/reviews/a36406955/2022-volkswagen-golf-gti-by-the-numbers/"]
front = "235/35 R19"
rear = "235/35 R19"
model = "Bridgestone Potenza S005"

[aero]
sources = ["km77 https://km77.com/coches/volkswagen/golf/2020/5-puertas/gti/informacion/volkswagen-golf-gti-2020-informacion-tecnica"]
