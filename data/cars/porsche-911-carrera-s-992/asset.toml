# Asset pipeline parameters for the 911 Carrera S (992.1) coupe.
# Dimensions (length, width, height, wheelbase, tracks, tire sizes) come from
# car.toml and are hard constraints; everything here is shape.

# Wheel discs [s, radius] drawn into the side-view silhouette check.
preview_wheels = [[1.040, 0.340], [3.490, 0.358]]

[blueprint]
# Four-view vector drawing of the 992 Carrera 4S (same wide body and dimensions as
# the Carrera S). Watermarked preview, not redistributed: fetched into refs/cache/.
image = "https://www.the-blueprints.com/modules/vectordrawings/preview-wm/porsche_911_carrera_4s_992_2019.jpg"
source = "https://www.the-blueprints.com/vectordrawings/show/17525/porsche_911_carrera_4s_992/"
# Pixel boxes [x0, y0, x1, y1] of each view in the 1280x905 image.
views = { side = [40, 100, 840, 330], top = [40, 450, 840, 810], front = [870, 100, 1240, 335], rear = [870, 510, 1240, 760] }
paint_blue_margin = 60
dark_sum = 540
close_px = 6
# Polygons (source px) filled into a view where the light glass meets the background.
fill = { side = [[[290, 180], [400, 121], [425, 121], [365, 180]]] }

[body]
# Loft resolution: stations along the length, rows per band of the half section.
stations = 400
rows = { floor = 6, well = 10, lip = 8, lower = 34, upper = 30, side_top = 40, top = 40 }
# Stations placed exactly on panel edges (s, m from the nose).
key_stations = [0.66, 1.42, 1.62, 2.84, 3.95, 4.30, 4.46]
# Blueprint ranges replaced by interpolation: mirrors in the top view, a
# watermark speck on the nose in the side view.
patch_width = [[1.78, 2.16]]
patch_top = []
# Gaussian smoothing of the blueprint profiles (m); the windscreen base kink is kept.
smooth_sigma = 0.035
smooth_sigma_width = 0.06
# Fairing of the loft along the length (Gaussian over stations, rows above the widest point).
fair_sigma_stations = 2.5
fair_passes = 2
smooth_keep = [1.42]
top_override = [[[0.0, 0.50], [0.05, 0.55], [0.12, 0.578], [0.16, 0.586]], [[4.40, 0.824], [4.45, 0.775], [4.49, 0.735], [4.519, 0.68]]]

# Wheel arches: centre s, centre height z, radius, inner wall of the wheel well
# (track/2 - tire width/2 - 30 mm).
[[body.arches]]
s = 1.040
z = 0.345
radius = 0.392
well_y = 0.642

[[body.arches]]
s = 3.490
z = 0.365
radius = 0.405
well_y = 0.596

# Control tables, [[s, value], ...] interpolated monotonically. f_* are
# fractions of the blueprint half width w(s); z_* are heights in metres.
[body.tables]
z_floor = [[0.0, 0.14], [0.3, 0.12], [3.7, 0.13], [4.0, 0.17], [4.4, 0.20], [4.519, 0.24]]
z_rocker = [[0.0, 0.22], [1.6, 0.21], [2.9, 0.21], [3.9, 0.32], [4.519, 0.40]]
f_rocker = [[0.0, 0.95], [1.5, 0.95], [1.8, 0.93], [2.9, 0.93], [3.2, 0.95], [3.9, 0.92], [4.519, 0.80]]
z_widest = [[0.0, 0.40], [0.5, 0.58], [1.0, 0.64], [1.4, 0.60], [1.8, 0.58], [2.8, 0.62], [3.4, 0.70], [3.8, 0.70], [4.2, 0.68], [4.519, 0.66]]
z_shoulder = [[0.0, 0.50], [1.4, 0.89], [1.6, 0.93], [2.4, 0.96], [3.1, 0.97], [3.6, 0.95], [4.0, 0.91], [4.3, 0.85], [4.519, 0.70]]
f_shoulder = [[0.0, 0.84], [0.5, 0.84], [1.2, 0.83], [1.5, 0.80], [1.8, 0.80], [2.8, 0.81], [3.3, 0.86], [4.2, 0.86], [4.519, 0.85]]
center_dip = [[0.0, 0.0], [0.2, 0.0], [0.4, 0.045], [0.7, 0.04], [1.1, 0.02], [1.42, 0.0], [4.519, 0.0]]
edge_drop = [[0.0, 0.01], [1.3, 0.015], [1.5, 0.04], [2.0, 0.06], [2.8, 0.07], [3.4, 0.08], [3.9, 0.06], [4.3, 0.035], [4.519, 0.015]]
f_edge = [[0.0, 0.55], [0.5, 0.58], [1.3, 0.66], [1.5, 0.71], [2.2, 0.68], [2.7, 0.64], [3.2, 0.50], [3.6, 0.45], [4.0, 0.44], [4.3, 0.52], [4.519, 0.60]]

[paint]
