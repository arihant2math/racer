# Reference blueprints for the silhouette gate (racer-assetqa gate 4).
#
# Each [[sheet]] is one image with several orthographic views drawn at one
# scale. Pixel coordinates are measured on the committed image (x right,
# y down, pixel corners). Alignment, done by racer-assetqa (src/refs.rs):
#
#   scale    metres per pixel = wheelbase from car.toml (2.450 m) / distance
#            between the side view's axle centres; shared by all views of a sheet
#   side     axle midpoint = origin (z = 0), ground_y = ground line (y = 0)
#   front,   ground_y = ground line, centreline = middle of the silhouette
#   rear     (symmetric car)
#   top      centreline = middle of the silhouette; front-most pixel placed at
#            the front-most z measured in the side view of the same sheet
#
# Silhouettes: pixels darker than ink_max_luma or more saturated than
# ink_min_saturation are ink; every region not reachable from the crop border
# is filled (closes windows, wheels and outline drawings); the largest
# connected piece is kept (drops watermark specks, labels and dimension text),
# and everything below the ground line is cleared (crops may include the
# drawn ground line so that wheel outlines stay closed).
# `racer-assetqa refs porsche-911-carrera-s-992` writes the masks and prints
# how well the two sheets agree.

[[sheet]]
id = "the-blueprints"
image = "the-blueprints-911-carrera-4s-992-2019.png"
source = "https://www.the-blueprints.com/vectordrawings/show/17529/porsche_911_carrera_s_992/ (free watermarked preview https://www.the-blueprints.com/modules/vectordrawings/preview-wm/porsche_911_carrera_s_992_2019.jpg, fetched 2026-10-27; converted losslessly from the JPEG to PNG)"
note = """Vector drawing of the 992 Carrera 4S (2019), 1:25, labelled 4519 x 1300 mm, \
wheelbase 2450, width over mirrors 2024. The Carrera S and 4S share the body shell \
and dimensions (4S rear track is the same within 10 mm), so the silhouettes apply. \
Measured: axle centres from the widest row of each tyre (front 163-295 px, rear \
580-717 px); ground = bottom of the tyres. Scale 5.84 mm/px; length over the \
outline 777 px = 4.538 m (+0.4 %), height 1.294 m."""
role = "gate"
# Window and headlight outlines are as light as luma 170-177; the watermark
# text is luma 189 and up (1st percentile), so 182 separates them.
ink_max_luma = 182
ink_min_saturation = 60
front_axle_x = 229.0
rear_axle_x = 648.5

[[sheet.view]]
view = "side"
crop = [30, 95, 845, 336]
front = "left"
ground_y = 332.0

[[sheet.view]]
view = "front"
crop = [870, 95, 1233, 336]
ground_y = 331.0

[[sheet.view]]
view = "rear"
crop = [870, 500, 1245, 760]
ground_y = 748.0

[[sheet.view]]
view = "top"
crop = [40, 440, 840, 815]
front = "left"

[[sheet]]
id = "dimensions-com"
image = "dimensions-com-911-carrera-992.png"
source = "https://www.dimensions.com/element/porsche-911-carrera-992-8th-gen (drawing https://cdn.prod.website-files.com/5b44edefca321a1e2d0c2aa6/672fbecdeb42cf5b27c72b8c_Dimensions-Transport-Sports-Cars-Porsche-911-Carrera-Dimensions.svg, fetched 2026-10-27; committed as the .svg and its 2x rasterisation by Chromium)"
note = """Line drawing of the 992 Carrera, labelled 454 x 185 x 130 cm, wheelbase 245 cm. \
Independent second source, gated too: the asset pipeline fits its body to the \
the-blueprints drawing, so this sheet is the check it was not tuned on. The two \
sheets agree to IoU 0.965 (side) - 0.992 (top), which bounds what the silhouette \
thresholds can demand. Front points right. Axle centres = tips of the \
wheelbase dimension arrow (396-1017 px); ground = top of the dashed ground line."""
role = "gate"
ink_max_luma = 150
ink_min_saturation = 60
front_axle_x = 1016.5
rear_axle_x = 396.5

[[sheet.view]]
view = "side"
crop = [100, 135, 1300, 472]
front = "right"
ground_y = 466.0

[[sheet.view]]
view = "front"
crop = [1360, 135, 1900, 472]
ground_y = 466.0

[[sheet.view]]
view = "rear"
crop = [1360, 640, 1900, 992]
ground_y = 985.0

[[sheet.view]]
view = "top"
crop = [100, 625, 1300, 1160]
front = "right"

